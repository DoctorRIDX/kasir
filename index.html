<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scanner</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #ffffff;
    color: #111111;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding: 16px;
}

#app {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}

#reader {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #eeeeee;
    border: 1px solid #cccccc;
    overflow: hidden;
}

#reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
}

.total {
    width: 100%;
    padding: 18px 0;
    border-bottom: 1px solid #cccccc;
    font-size: 34px;
    font-weight: 700;
    text-align: right;
}

#list {
    width: 100%;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding: 10px 0;
    border-bottom: 1px solid #dddddd;
    font-size: 16px;
}

.item-code {
    color: #555555;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.item-price {
    flex-shrink: 0;
    font-weight: 600;
}

.bottom {
    display: flex;
    justify-content: flex-end;
    padding-top: 14px;
}

button {
    border: 1px solid #111111;
    background: #111111;
    color: #ffffff;
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
}

button:active {
    background: #333333;
}

.empty {
    padding: 20px 0;
    color: #777777;
    text-align: center;
}

@media (max-width: 480px) {
    body {
        padding: 10px;
    }

    .total {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="reader"></div>

    <div class="total" id="total">
        Rp0
    </div>

    <div id="list">
        <div class="empty" id="empty">
            Belum ada
        </div>
    </div>

    <div class="bottom">
        <button id="reset">Reset</button>
    </div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const PRODUCTS = {
    "8991002100011": 5000,
    "8991002100028": 7500,
    "8991002100035": 10000,
    "8991002100042": 12500,
    "8991002100059": 15000,
    "8991002100066": 20000
};

let total = 0;
let items = [];
let lastCode = "";
let lastScanTime = 0;

const totalElement = document.getElementById("total");
const listElement = document.getElementById("list");
const emptyElement = document.getElementById("empty");
const resetButton = document.getElementById("reset");

function formatRupiah(number) {
    return "Rp" + number.toLocaleString("id-ID");
}

function updateTotal() {
    totalElement.textContent = formatRupiah(total);
}

function renderList() {
    listElement.innerHTML = "";

    if (items.length === 0) {
        listElement.appendChild(emptyElement);
        return;
    }

    items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "item";

        const code = document.createElement("div");
        code.className = "item-code";
        code.textContent = item.code;

        const price = document.createElement("div");
        price.className = "item-price";
        price.textContent = formatRupiah(item.price);

        row.appendChild(code);
        row.appendChild(price);

        listElement.appendChild(row);
    });
}

function beep() {
    try {
        const AudioContext =
            window.AudioContext || window.webkitAudioContext;

        const audioContext = new AudioContext();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "square";
        oscillator.frequency.value = 1200;

        gain.gain.setValueAtTime(0.08, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.12
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.12);
    } catch (error) {
        console.warn("Audio tidak tersedia:", error);
    }
}

function addProduct(code) {
    const now = Date.now();

    // Mencegah satu barcode terbaca berkali-kali
    // dalam waktu yang sangat singkat.
    if (
        code === lastCode &&
        now - lastScanTime < 1200
    ) {
        return;
    }

    lastCode = code;
    lastScanTime = now;

    const price = PRODUCTS[code];

    // Hanya barcode yang terdaftar yang dihitung.
    if (price === undefined) {
        return;
    }

    beep();

    total += price;

    items.push({
        code: code,
        price: price
    });

    updateTotal();
    renderList();
}

const scanner = new Html5Qrcode("reader");

function onScanSuccess(decodedText) {
    addProduct(decodedText.trim());
}

function onScanFailure() {
    // Sengaja kosong.
    // Scanner akan terus mencoba membaca frame kamera.
}

scanner.start(
    {
        facingMode: {
            exact: "environment"
        }
    },
    {
        fps: 10,
        qrbox: {
            width: 280,
            height: 160
        },
        formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.ITF
        ]
    },
    onScanSuccess,
    onScanFailure
).catch((error) => {
    console.error("Kamera gagal dibuka:", error);
});

resetButton.addEventListener("click", () => {
    total = 0;
    items = [];
    lastCode = "";
    lastScanTime = 0;

    updateTotal();
    renderList();
});

updateTotal();
renderList();
</script>

</body>
</html>
